# Model slots for Experiment 1 (B and C on Who&When Pro multi-agent text traces). Keys come from ../.env (never written here).
# Temperature/top_p/seed are NOT sent (reasoning models; provider defaults). Single user message, no system prompt.
models:
  luna:
    api: openai_responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model_id: gpt-5.6-luna
    reasoning: {effort: high}
    max_output_tokens: 32768
  mimo:   # same as the Oct 12 run (error_localization/prompt_A_benchmark/config/models.yaml)
    api: openai_chat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    model_id: "XiaomiMiMo/MiMo-V2.6-Pro-RL:novita"
    reasoning: provider_default
    max_output_tokens: 131072
  gemma:  # served locally by vLLM on Google Colab (see ../colab/); replaces the OpenRouter routes (free tier: 429, paid: 402 no credits). 12B (not 31B) because the 31B did not fit the available 40 GB GPU
    api: openai_chat
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY          # dummy value; local server
    model_id: "google/gemma-4-12B-it"
    reasoning: "thinking ON via server default chat-template kwarg enable_thinking=true; vLLM reasoning parser gemma4 (thoughts are NOT in the scored text)"
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64, seed: 0}   # Google's recommended settings for Gemma 4
    max_output_tokens: 16384           # includes thinking tokens
    max_model_len: 40960               # longest prompt is 23,927 tokens + 16,384 output
