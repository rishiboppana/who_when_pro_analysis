# Model slots for Experiment 1 (B and C on Who&When Pro multi-agent text traces). Keys come from ../.env (never written here).
# Temperature/top_p/seed are NOT sent (reasoning models; provider defaults). Single user message, no system prompt.
models:
  luna:
    api: openai_responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model_id: gpt-5.6-luna
    reasoning: {effort: high}
    max_output_tokens: 32768
  mimo:   # same as the Oct 12 run (error_localization/prompt_A_benchmark/config/models.yaml)
    api: openai_chat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    model_id: "XiaomiMiMo/MiMo-V2.6-Pro-RL:novita"
    reasoning: provider_default
    max_output_tokens: 131072
  qwen:   # served locally by vLLM on Google Colab (4-bit GPTQ INT4 weights, activations in BF16); see ../colab/
    api: openai_chat
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY          # dummy value; local server
    model_id: "RedHatAI/Qwen3.5-9B-quantized.w4a16"
    reasoning: "thinking ON (Qwen3.5 default) via server default chat-template kwarg enable_thinking=true; vLLM reasoning parser qwen3 (thoughts are NOT in the scored text)"
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, seed: 0}   # Qwen3.5 model card: thinking mode, general tasks
    max_output_tokens: 32768           # includes thinking tokens (same as luna)
    max_model_len: 57344               # longest prompt 23,927 tokens + 32,768 output
  qwen122:   # Qwen3.5-122B-A10B (MoE, 10B active) via the Hugging Face router, provider novita (user decision, replaces the local 9B plan)
    api: openai_chat
    base_url: https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
    model_id: "Qwen/Qwen3.5-122B-A10B:novita"
    reasoning: provider_default        # Qwen3.5 thinks by default; thoughts arrive as reasoning_content and are not in the scored text
    max_output_tokens: 32768           # includes thinking tokens (same cap as luna; MiMo used 131072)
